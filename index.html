<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしのオタク年表ジェネレーター</title>

    <meta property="og:description" id="og-desc" content="オタク年表を作成しました！あなたの履修歴は？年表でチェック！">

    <meta property="og:image" id="og-image" content="https://sasagod.github.io/otaku-timeline/ogp-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="tw-title" content="わたしのオタク年表">
    <meta name="twitter:description" id="tw-desc" content="オタク年表を作成しました！あなたの履修歴は？年表でチェック！">
    <meta name="twitter:image" id="tw-image" content="https://sasagod.github.io/otaku-timeline/ogp-image.png">

    <!-- Tailwind CSS -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Image Export -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        otaku: {
                            red: '#e34451',
                            orange: '#e68637',

                            green: '#2f9e3a',
                            cyan: '#77cdf2',
                            blue: '#4b5fd1',

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for timeline horizontal scroll */
        .timeline-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .timeline-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 9999px;
        }
        .timeline-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 9999px;
        }
        .timeline-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }

        /* Color preview selection active ring */
        .color-dot.selected {
            transform: scale(1.2);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.5);
        }

        /* Export Background Theme Styles */
        .bg-theme-pastel-red { background: linear-gradient(135deg, #fff0f2 0%, #ffe3e8 100%); color: #334155; }
        .bg-theme-pastel-orange { background: linear-gradient(135deg, #fff6ed 0%, #ffebd9 100%); color: #334155; }
        .bg-theme-pastel-yellow { background: linear-gradient(135deg, #fffde6 0%, #fff9b8 100%); color: #334155; }
        .bg-theme-pastel-green { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); color: #334155; }
        .bg-theme-pastel-cyan { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); color: #334155; }
        .bg-theme-pastel-purple { background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%); color: #334155; }
        .bg-theme-white { background: #ffffff; color: #334155; }
        .bg-theme-dark { background: #18181b; color: #f4f4f5; }

        /* Sleek Timeline Tag Bar Design */
        .timeline-bar {
            box-shadow: 0 2px 8px -1px rgba(0, 0, 0, 0.12), 0 1px 4px -1px rgba(0, 0, 0, 0.07);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .timeline-bar:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -1px rgba(0, 0, 0, 0.18);

        /* Explicit font height & baseline alignment for clean canvas exports */
        .timeline-title-text {
            display: inline-block;
            line-height: 1.4 !important;
            vertical-align: middle;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            overflow: visible;

    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- JavaScript Application Logic -->
    <script>
        // Color Palette definition (10 specific colors)
        const COLOR_PALETTE = [
            { id: 'red', name: '赤', hex: '#e34451', text: '#ffffff' },
            { id: 'orange', name: 'オレンジ', hex: '#e68637', text: '#ffffff' },
            { id: 'yellow', name: '黄色', hex: '#ffdb4a', text: '#334155' },
            { id: 'lime', name: '黄緑', hex: '#85d63e', text: '#ffffff' },
            { id: 'green', name: '緑', hex: '#2f9e3a', text: '#ffffff' },
            { id: 'cyan', name: '水色', hex: '#77cdf2', text: '#ffffff' },
            { id: 'blue', name: '青', hex: '#4b5fd1', text: '#ffffff' },
            { id: 'purple', name: '紫', hex: '#8a45de', text: '#ffffff' },
            { id: 'pink', name: 'ピンク', hex: '#f573cc', text: '#ffffff' },
            { id: 'gray', name: 'グレー', hex: '#4c4c4c', text: '#ffffff' }
        ];

        // Export Themes
        const THEMES = [
            { id: 'white', label: 'ホワイト', class: 'bg-theme-white', color: '#ffffff' },
            { id: 'pastel-purple', label: 'パープル', class: 'bg-theme-pastel-purple', color: '#f3e8ff' },
            { id: 'pastel-pink', label: 'レッド', class: 'bg-theme-pastel-red', color: '#ffe3e8' },
            { id: 'pastel-cyan', label: '水色', class: 'bg-theme-pastel-cyan', color: '#e0f2fe' },
            { id: 'pastel-yellow', label: 'イエロー', class: 'bg-theme-pastel-yellow', color: '#fff9b8' },
            { id: 'pastel-green', label: 'グリーン', class: 'bg-theme-pastel-green', color: '#dcfce7' },
            { id: 'pastel-orange', label: 'オレンジ', class: 'bg-theme-pastel-orange', color: '#ffebd9' },
            { id: 'dark', label: 'ダーク', class: 'bg-theme-dark', color: '#18181b' }
        ];

        const CURRENT_YEAR = 2026;
        const STORAGE_KEY = 'otaku_timeline_data_v1';

        // Application State (Default Item: 自分)
        let state = {
            title: 'わたしのオタク年表',
            birthYear: 2000,
            scaleMode: 'year', // 'year', 'age'
            selectedTheme: 'pastel-purple',
            selectedColor: '#8a45de',
            isSharedView: false,
            items: [
                {
                    id: 'default-1',
                    title: '自分',
                    memo: '',
                    startYear: 2000,
                    endYear: CURRENT_YEAR,
                    color: '#8a45de'
                }
            ]
        };

        // Load saved state from LocalStorage
        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') {
                        if (Array.isArray(parsed.items)) state.items = parsed.items;
                        if (parsed.title) state.title = parsed.title;
                        if (parsed.birthYear) state.birthYear = parseInt(parsed.birthYear);
                        if (parsed.scaleMode) state.scaleMode = parsed.scaleMode;
                        if (parsed.selectedTheme) state.selectedTheme = parsed.selectedTheme;
                        if (parsed.selectedColor) state.selectedColor = parsed.selectedColor;
                    }
                }
            } catch (e) {
                console.warn('Failed to load saved state from localStorage:', e);
            }
        }

        // Save state to LocalStorage
        function saveState() {
            if (state.isSharedView) return; // Don't overwrite local save in shared view mode
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Failed to save state to localStorage:', e);
            }
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            const hasSharedData = loadStateFromURL();
            if (!hasSharedData) {
                loadSavedState();
            } else {
                state.isSharedView = true;
                setupSharedViewUI();
            }
            
            // Sync UI inputs with state
            document.getElementById('timeline-title-input').value = state.title;
            document.getElementById('scale-mode-select').value = state.scaleMode;

            initBirthYearSelect();
            initThemeButtons();
            initColorPalette();
            updateYearOptions(false);
            
            document.getElementById('canvas-footer-date').innerText = new Date().toLocaleDateString('ja-JP');
            render();
        });

        // Setup Shared View UI layout
        function setupSharedViewUI() {
            document.getElementById('shared-view-banner').classList.remove('hidden');
            const editorSidebar = document.getElementById('editor-sidebar');
            const previewSection = document.getElementById('preview-section');
            const actionButtonsArea = document.getElementById('action-buttons-area');

            // Hide edit form sidebar and creator action buttons in shared view
            editorSidebar.classList.add('hidden');
            if (actionButtonsArea) actionButtonsArea.classList.add('hidden');
            
            previewSection.classList.remove('lg:col-span-8');
            previewSection.classList.add('lg:col-span-12');
        }

        // Load state from URL hash if available (for shared links)
        function loadStateFromURL() {
            try {
                const hash = window.location.hash.substring(1);
                if (hash) {
                    const jsonStr = decodeURIComponent(atob(hash));
                    const parsed = JSON.parse(jsonStr);
                    if (parsed && typeof parsed === 'object') {
                        if (Array.isArray(parsed.items)) state.items = parsed.items;
                        if (parsed.title) state.title = parsed.title;
                        if (parsed.birthYear) state.birthYear = parseInt(parsed.birthYear);
                        if (parsed.scaleMode) state.scaleMode = parsed.scaleMode;
                        if (parsed.selectedTheme) state.selectedTheme = parsed.selectedTheme;
                        if (parsed.selectedColor) state.selectedColor = parsed.selectedColor;
                        return true;
                    }
                }
            } catch (e) {
                console.warn('Failed to parse state from URL:', e);
            }
            return false;
        }

        // Generate Short URL via TinyURL API for smooth Twitter sharing
        async function getShortenedURL(longUrl) {
            try {
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (res.ok) {
                    const shortUrl = await res.text();
                    if (shortUrl && shortUrl.startsWith('http')) {
                        return shortUrl.trim();
                    }
                }
            } catch (e) {
                console.warn('TinyURL shortening failed, using original long URL:', e);
            }
            return longUrl;
        }

        // Generate Shareable URL (Optimized & Compacted payload)
        function generateShareURL() {
            // Compress key names to keep base64 strings extremely short
            const compactItems = state.items.map(i => ({
                t: i.title,
                m: i.memo || '',
                s: i.startYear,
                e: i.endYear,
                c: i.color
            }));

            const copyState = {
                t: state.title,
                b: state.birthYear,
                sm: state.scaleMode,
                th: state.selectedTheme,
                cl: state.selectedColor,
                i: compactItems
            };
            const jsonStr = JSON.stringify(copyState);
            const encoded = btoa(encodeURIComponent(jsonStr));
            const baseUrl = window.location.origin + window.location.pathname;
            return `${baseUrl}#${encoded}`;
        }

        // Load state from URL hash if available (Supports both compact & legacy format)
        function loadStateFromURL() {
            try {
                const hash = window.location.hash.substring(1);
                if (hash) {
                    const jsonStr = decodeURIComponent(atob(hash));
                    const parsed = JSON.parse(jsonStr);
                    if (parsed && typeof parsed === 'object') {
                        // Compact format support
                        if (parsed.i && Array.isArray(parsed.i)) {
                            state.items = parsed.i.map((item, idx) => ({
                                id: `item-shared-${idx}`,
                                title: item.t,
                                memo: item.m || '',
                                startYear: item.s,
                                endYear: item.e,
                                color: item.c
                            }));
                        } else if (Array.isArray(parsed.items)) {
                            state.items = parsed.items;
                        }

                        state.title = parsed.t || parsed.title || state.title;
                        state.birthYear = parseInt(parsed.b || parsed.birthYear || state.birthYear);
                        state.scaleMode = parsed.sm || parsed.scaleMode || state.scaleMode;
                        state.selectedTheme = parsed.th || parsed.selectedTheme || state.selectedTheme;
                        state.selectedColor = parsed.cl || parsed.selectedColor || state.selectedColor;
                        return true;
                    }
                }
            } catch (e) {
                console.warn('Failed to parse state from URL:', e);
            }
            return false;
        }

                const shareUrl = `https://x.com/intent/post?text=${encodeURIComponent(tweetText)}&url=${encodeURIComponent(shortUrl)}`;
                
                // Open window safely (works on PC popup blockers)

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editing-id').value;
            const title = document.getElementById('item-title').value.trim();
            const memo = document.getElementById('item-memo').value.trim();
            let startYear = parseInt(document.getElementById('item-start-year').value);
            const isOngoing = document.getElementById('item-is-ongoing').checked;
            let endYear = isOngoing ? CURRENT_YEAR : parseInt(document.getElementById('item-end-year').value);

            if (!title) return;

            if (startYear > endYear) {
                const temp = startYear;
                startYear = endYear;
                endYear = temp;
            }

            if (editId) {
                const index = state.items.findIndex(i => i.id === editId);
                if (index !== -1) {
                    state.items[index] = {
                        ...state.items[index],
                        title,
                        memo,
                        startYear,
                        endYear,
                        color: state.selectedColor
                    };
                }
            } else {
                const newItem = {
                    id: 'item-' + Date.now(),
                    title,
                    memo,
                    startYear,
                    endYear,
                    color: state.selectedColor
                };
                state.items.push(newItem);
            }

            resetForm();
            render();
        }

        // Move Item in list order
        function moveItem(id, direction) {
            const index = state.items.findIndex(i => i.id === id);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= state.items.length) return;

            const temp = state.items[index];
            state.items[index] = state.items[newIndex];
            state.items[newIndex] = temp;
            render();
        }

        // Calculate automatic track allocation for items to avoid horizontal overlaps
        function allocateTracks(items) {
            const sorted = [...items].sort((a, b) => {
                if (a.startYear !== b.startYear) return a.startYear - b.startYear;
                return (b.endYear - b.startYear) - (a.endYear - a.startYear);
            });

            const tracks = [];

            return sorted.map(item => {
                let assignedTrack = -1;
                for (let t = 0; t < tracks.length; t++) {
                    if (tracks[t] < item.startYear) {
                        assignedTrack = t;
                        tracks[t] = item.endYear;
                        break;
                    }
                }
                if (assignedTrack === -1) {
                    assignedTrack = tracks.length;
                    tracks.push(item.endYear);
                }
                return { ...item, track: assignedTrack };
            });
        }

        // Render Grid & Timeline Bars inside Canvas
        function renderCanvasGrid() {
            const container = document.getElementById('timeline-grid-container');
            container.innerHTML = '';

            const startY = state.birthYear;
            const endY = CURRENT_YEAR;
            const totalYears = endY - startY + 1;

            const itemsWithTracks = allocateTracks(state.items);
            const totalTracks = itemsWithTracks.reduce((max, item) => Math.max(max, item.track), -1) + 1;
            
            // Further increased row and bar height for zero text clipping
            const trackHeight = 54;
            const headerHeight = 44;

            const minCellWidth = 56;
            const calculatedWidth = totalYears * minCellWidth;
            container.style.width = `${calculatedWidth}px`;
            container.style.minWidth = `${calculatedWidth}px`;

            const mainGrid = document.createElement('div');
            mainGrid.className = 'grid relative w-full select-none';
            mainGrid.style.gridTemplateColumns = `repeat(${totalYears}, minmax(0, 1fr))`;

            // 1. Header Cells (4-digit year or age without sublabel)
            for (let y = startY; y <= endY; y++) {
                const cell = document.createElement('div');
                cell.className = 'px-1 py-1 text-center border-b border-slate-300/50 flex items-center justify-center font-extrabold text-slate-700 bg-white/30 backdrop-blur-sm z-20';
                cell.style.height = `${headerHeight}px`;

                const age = y - startY;
                const label = state.scaleMode === 'year' ? `${y}` : `${age}歳`;

                cell.innerHTML = `<span class="text-xs tracking-tight font-extrabold">${label}</span>`;
                mainGrid.appendChild(cell);
            }

            // 2. Background Grid Lines Area
            const bodyHeight = Math.max(totalTracks * trackHeight + 40, 200);
            const bgContainer = document.createElement('div');
            bgContainer.className = 'absolute top-0 left-0 w-full h-full pointer-events-none grid z-0';
            bgContainer.style.gridTemplateColumns = `repeat(${totalYears}, minmax(0, 1fr))`;
            bgContainer.style.height = `${headerHeight + bodyHeight}px`;

            for (let i = 0; i < totalYears; i++) {
                const line = document.createElement('div');
                line.className = `border-r ${i === totalYears - 1 ? 'border-transparent' : 'border-slate-300/30'}`;
                bgContainer.appendChild(line);
            }
            container.appendChild(bgContainer);
            container.appendChild(mainGrid);

            // 3. Timeline Items Area
            const barsContainer = document.createElement('div');
            barsContainer.className = 'relative w-full z-10 mt-3';
            barsContainer.style.height = `${bodyHeight}px`;

            itemsWithTracks.forEach(item => {
                const bar = document.createElement('div');
                const startIdx = Math.max(0, item.startYear - startY);
                const endIdx = Math.min(totalYears - 1, item.endYear - startY);
                const spanYears = endIdx - startIdx + 1;

                const leftPercent = (startIdx / totalYears) * 100;
                const widthPercent = (spanYears / totalYears) * 100;

                const topPx = item.track * trackHeight;
                const paletteObj = COLOR_PALETTE.find(c => c.hex.toLowerCase() === item.color.toLowerCase()) || { text: '#ffffff' };

                bar.className = 'timeline-bar absolute rounded-full px-3 text-xs font-bold truncate cursor-pointer';
                bar.style.left = `${leftPercent}%`;
                bar.style.width = `calc(${widthPercent}% - 4px)`;
                bar.style.marginLeft = '2px';
                bar.style.top = `${topPx}px`;
                bar.style.height = '42px'; // Height increased to 42px
                bar.style.backgroundColor = item.color;
                bar.style.color = paletteObj.text;

                const isOngoing = item.endYear === CURRENT_YEAR;
                
                bar.innerHTML = `
                    <span class="timeline-title-text">
                        ${escapeHtml(item.title)}
                    </span>
                    ${isOngoing ? '<span class="text-[10px] flex-shrink-0 bg-white/25 backdrop-blur-sm px-2 py-0.5 rounded-full ml-1.5 font-bold leading-none">🔥 現在</span>' : ''}
                `;

                bar.onclick = () => editItem(item.id);
                barsContainer.appendChild(bar);
            });

            container.appendChild(barsContainer);
        }

        // Helper function for HTML escaping
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Export Timeline as PNG Image (Full grid width expansion + Font-rendering fix)
        async function exportImage() {
            const btn = document.getElementById('export-btn');
            const target = document.getElementById('timeline-canvas');
            const scrollWrapper = target.querySelector('.overflow-x-auto');
            const gridContainer = document.getElementById('timeline-grid-container');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>画像生成中...</span>`;

            // Wait for fonts to be completely ready
            if (document.fonts) {
                await document.fonts.ready;
            }

            const prevScrollLeft = scrollWrapper ? scrollWrapper.scrollLeft : 0;
            const prevOverflow = scrollWrapper ? scrollWrapper.style.overflow : '';
            const prevWidth = target.style.width;

            try {
                if (scrollWrapper) {
                    scrollWrapper.scrollLeft = 0;
                    scrollWrapper.style.overflow = 'visible';
                }

                const fullGridWidth = gridContainer ? gridContainer.scrollWidth : target.scrollWidth;
                const paddedWidth = fullGridWidth + 64;
                target.style.width = `${paddedWidth}px`;

                const canvas = await html2canvas(target, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: null,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0,
                    width: paddedWidth,
                    windowWidth: paddedWidth + 100,
                    onclone: (clonedDoc) => {
                        const clonedTarget = clonedDoc.getElementById('timeline-canvas');
                        if (clonedTarget) {
                            // Apply safe system fonts & line-heights to eliminate clipping in Chrome/Edge
                            const allTexts = clonedTarget.querySelectorAll('.timeline-title-text, .memo-card-title, .memo-card-sub, h2, h3, p, span');
                            allTexts.forEach(el => {
                                el.style.fontFamily = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
                                el.style.lineHeight = '1.4';
                                el.style.overflow = 'visible';
                                el.style.maxHeight = 'none';
                                el.style.height = 'auto';
                            });
                            
                            const bars = clonedTarget.querySelectorAll('.timeline-bar');
                            bars.forEach(b => {
                                b.style.display = 'flex';
                                b.style.alignItems = 'center';
                                b.style.justifyContent = 'space-between';
                                b.style.height = '42px';
                                b.style.paddingTop = '0px';
                                b.style.paddingBottom = '0px';
                            });
                        }
                    }
                });

                const link = document.createElement('a');
                link.download = `${state.title.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Export error:', err);
                alert('画像の出力中にエラーが発生しました。');
            } finally {
                target.style.width = prevWidth || '';
                if (scrollWrapper) {
                    scrollWrapper.style.overflow = prevOverflow || '';
                    scrollWrapper.scrollLeft = prevScrollLeft;
                }

                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-download"></i> <span>画像として保存 (.PNG)</span>`;
            }
        }
    </script>
</body>
