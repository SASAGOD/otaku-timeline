<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしのオタク年表ジェネレーター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        otaku: {
                            red: '#e34451',
                            orange: '#e68637',
                            yellow: '#ffdb4a',
                            lime: '#85d63e',
                            green: '#2f9e3a',
                            cyan: '#77cdf2',
                            blue: '#4b5fd1',
                            purple: '#8a45de',
                            pink: '#f573cc',
                            gray: '#4c4c4c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for timeline horizontal scroll */
        .timeline-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .timeline-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 9999px;
        }
        .timeline-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 9999px;
        }
        .timeline-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }

        /* Color preview selection active ring */
        .color-dot.selected {
            transform: scale(1.2);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.5);
        }

        /* Export Background Theme Styles */
        .bg-theme-pastel-red { background: linear-gradient(135deg, #fff0f2 0%, #ffe3e8 100%); color: #334155; }
        .bg-theme-pastel-orange { background: linear-gradient(135deg, #fff6ed 0%, #ffebd9 100%); color: #334155; }
        .bg-theme-pastel-yellow { background: linear-gradient(135deg, #fffde6 0%, #fff9b8 100%); color: #334155; }
        .bg-theme-pastel-green { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); color: #334155; }
        .bg-theme-pastel-cyan { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); color: #334155; }
        .bg-theme-pastel-purple { background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%); color: #334155; }
        .bg-theme-white { background: #ffffff; color: #334155; }
        .bg-theme-dark { background: #18181b; color: #f4f4f5; }

        /* Sleek Timeline Tag Bar Design */
        .timeline-bar {
            box-shadow: 0 2px 8px -1px rgba(0, 0, 0, 0.12), 0 1px 4px -1px rgba(0, 0, 0, 0.07);
            transition: all 0.2s ease;
        }
        .timeline-bar:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -1px rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-purple-200">
                    <i class="fa-solid font-bold fa-timeline text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl text-slate-900 tracking-tight flex items-center gap-2">
                        オタク年表ジェネレーター
                        <span class="text-xs bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full">v2.0</span>
                    </h1>
                    <p class="text-xs text-slate-500">ハマった作品・推し歴史をかわいく可視化！</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <button id="export-btn" onclick="exportImage()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-md shadow-purple-200 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    画像として保存 (.PNG)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls & Editor Section (Left Sidebar) -->
        <section class="lg:col-span-4 flex flex-col gap-5">
            
            <!-- Global Config Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-bold text-slate-800 text-base flex items-center gap-2 border-b border-slate-100 pb-2">
                    <i class="fa-solid fa-sliders text-purple-500"></i>
                    年表の基本設定
                </h2>

                <!-- Title Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年表タイトル</label>
                    <input type="text" id="timeline-title-input" value="わたしのオタク年表" oninput="updateConfig()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 font-bold">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <!-- Birth Year -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">生まれ年 (生年)</label>
                        <select id="birth-year-select" onchange="updateConfig()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500">
                            <!-- Options generated dynamically -->
                        </select>
                    </div>

                    <!-- Header Scale Toggle -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">目盛り表示</label>
                        <select id="scale-mode-select" onchange="updateConfig()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 font-bold">
                            <option value="year" selected>西暦のみ</option>
                            <option value="age">年齢のみ</option>
                        </select>
                    </div>
                </div>

                <!-- Export Theme Selector -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">背景テーマ (画像保存時)</label>
                    <div class="grid grid-cols-4 gap-2" id="theme-buttons">
                        <!-- Theme options generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Add / Edit Item Form Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h2 class="font-bold text-slate-800 text-base flex items-center gap-2" id="form-title">
                        <i class="fa-solid fa-circle-plus text-purple-500"></i>
                        新しいコンテンツを追加
                    </h2>
                    <button id="cancel-edit-btn" onclick="resetForm()" class="hidden text-xs text-slate-500 hover:text-slate-800 underline">
                        キャンセル
                    </button>
                </div>

                <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-3.5">
                    <input type="hidden" id="editing-id" value="">

                    <!-- Content / Work Name -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">
                            コンテンツ / 作品名 <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="item-title" required placeholder="例: プリキュア5, あんスタ" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 transition-all">
                    </div>

                    <!-- Extra Info / Memo -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">
                            推し・メモ・補足 <span class="text-slate-400 font-normal">(任意)</span>
                        </label>
                        <input type="text" id="item-memo" placeholder="例: ミルキーローズ信者, 激萌えである" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 transition-all">
                    </div>

                    <!-- Start & End Year Selector -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">開始年</label>
                            <select id="item-start-year" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500">
                                <!-- Options dynamically filled -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">終了年</label>
                            <select id="item-end-year" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500">
                                <!-- Options dynamically filled -->
                            </select>
                        </div>
                    </div>

                    <!-- Ongoing Checkbox (Restored!) -->
                    <div class="flex items-center gap-2 pt-0.5">
                        <input type="checkbox" id="item-is-ongoing" onchange="toggleOngoing(this.checked)" class="w-4 h-4 text-purple-600 rounded border-slate-300 focus:ring-purple-500 cursor-pointer">
                        <label for="item-is-ongoing" class="text-xs font-bold text-slate-700 cursor-pointer select-none flex items-center gap-1">
                            <span>現在も継続中</span>
                            <span class="text-xs">🔥</span>
                        </label>
                    </div>

                    <!-- Color Selector (10 colors) -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">カラー選択</label>
                        <div class="flex flex-wrap gap-2.5" id="color-palette">
                            <!-- Color radio buttons populated by JS -->
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>年表に追加する</span>
                    </button>
                </form>
            </div>

            <!-- Items List Management -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-purple-500"></i>
                        登録コンテンツ一覧
                    </h2>
                    <span id="items-count-badge" class="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full">0件</span>
                </div>
                
                <div id="items-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Item list cards rendered dynamically -->
                </div>
            </div>

        </section>

        <!-- Timeline Preview Canvas Section (Right Main Canvas) -->
        <section class="lg:col-span-8 flex flex-col gap-4">

            <div class="flex items-center justify-between px-1">
                <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-eye text-purple-500"></i>
                    年表プレビュー
                </h2>
                <div class="text-xs text-slate-500 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>ドラッグまたは横スクロールで全体を確認できます</span>
                </div>
            </div>

            <!-- Exportable Container -->
            <div id="export-target-wrapper" class="rounded-3xl border border-slate-200 shadow-lg bg-white overflow-hidden">
                <!-- Inner Timeline Canvas (Background Theme Applies Here) -->
                <div id="timeline-canvas" class="p-6 md:p-8 transition-colors duration-300 w-full">
                    
                    <!-- Canvas Header Title & Subtitle (Fixed outside horizontal scroll) -->
                    <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between border-b pb-4 border-slate-200/60 gap-2">
                        <div>
                            <h2 id="display-timeline-title" class="text-2xl md:text-3xl font-extrabold tracking-tight">
                                わたしのオタク年表
                            </h2>
                            <p class="text-xs text-slate-400 mt-1 font-medium flex items-center gap-2">
                                <span id="display-birth-info">2000年生まれ</span>
                                <span>•</span>
                                <span id="display-period-info">2000 - 2026年</span>
                            </p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block text-[10px] uppercase font-bold tracking-widest text-purple-600 bg-purple-50/80 px-2.5 py-1 rounded-full border border-purple-200/60">
                                My Fandom Timeline
                            </span>
                        </div>
                    </div>

                    <!-- Outer Scroll Wrapper for Grid & Bars Only -->
                    <div class="overflow-x-auto timeline-scroll w-full pb-2">
                        <!-- Timeline Grid Canvas -->
                        <div class="relative">
                            <div id="timeline-grid-container" class="relative">
                                <!-- Dynamically Generated Grid & Bars -->
                            </div>
                        </div>
                    </div>

                    <!-- Canvas Footer Tag (Fixed outside horizontal scroll) -->
                    <div class="mt-4 pt-3 border-t border-slate-200/40 flex items-center justify-between text-[11px] text-slate-400">
                        <span>Generated by わたしのオタク年表</span>
                        <span id="canvas-footer-date"></span>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
        <p>© 2026 わたしのオタク年表 | All Rights Reserved.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Color Palette definition (10 specific colors)
        const COLOR_PALETTE = [
            { id: 'red', name: '赤', hex: '#e34451', text: '#ffffff' },
            { id: 'orange', name: 'オレンジ', hex: '#e68637', text: '#ffffff' },
            { id: 'yellow', name: '黄色', hex: '#ffdb4a', text: '#334155' },
            { id: 'lime', name: '黄緑', hex: '#85d63e', text: '#ffffff' },
            { id: 'green', name: '緑', hex: '#2f9e3a', text: '#ffffff' },
            { id: 'cyan', name: '水色', hex: '#77cdf2', text: '#334155' },
            { id: 'blue', name: '青', hex: '#4b5fd1', text: '#ffffff' },
            { id: 'purple', name: '紫', hex: '#8a45de', text: '#ffffff' },
            { id: 'pink', name: 'ピンク', hex: '#f573cc', text: '#ffffff' },
            { id: 'gray', name: 'グレー', hex: '#4c4c4c', text: '#ffffff' }
        ];

        // Export Themes
        const THEMES = [
            { id: 'white', label: 'ホワイト', class: 'bg-theme-white', color: '#ffffff' },
            { id: 'pastel-purple', label: 'パープル', class: 'bg-theme-pastel-purple', color: '#f3e8ff' },
            { id: 'pastel-pink', label: 'レッド', class: 'bg-theme-pastel-red', color: '#ffe3e8' },
            { id: 'pastel-cyan', label: '水色', class: 'bg-theme-pastel-cyan', color: '#e0f2fe' },
            { id: 'pastel-yellow', label: 'イエロー', class: 'bg-theme-pastel-yellow', color: '#fff9b8' },
            { id: 'pastel-green', label: 'グリーン', class: 'bg-theme-pastel-green', color: '#dcfce7' },
            { id: 'pastel-orange', label: 'オレンジ', class: 'bg-theme-pastel-orange', color: '#ffebd9' },
            { id: 'dark', label: 'ダーク', class: 'bg-theme-dark', color: '#18181b' }
        ];

        const CURRENT_YEAR = 2026;

        // Application State (Restored Default Item: 自分)
        let state = {
            title: 'わたしのオタク年表',
            birthYear: 2000,
            scaleMode: 'year', // 'year', 'age'
            selectedTheme: 'pastel-purple',
            selectedColor: '#8a45de',
            items: [
                {
                    id: 'default-1',
                    title: '自分',
                    memo: '',
                    startYear: 2000,
                    endYear: CURRENT_YEAR,
                    color: '#8a45de'
                }
            ]
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initBirthYearSelect();
            initThemeButtons();
            initColorPalette();
            updateYearOptions(true);
            
            document.getElementById('canvas-footer-date').innerText = new Date().toLocaleDateString('ja-JP');
            render();
        });

        // Initialize Birth Year Options (1970 - CURRENT_YEAR)
        function initBirthYearSelect() {
            const select = document.getElementById('birth-year-select');
            select.innerHTML = '';
            for (let y = 1970; y <= CURRENT_YEAR; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y}年`;
                if (y === state.birthYear) opt.selected = true;
                select.appendChild(opt);
            }
        }

        // Initialize Export Theme Selector Buttons
        function initThemeButtons() {
            const container = document.getElementById('theme-buttons');
            container.innerHTML = '';

            THEMES.forEach(t => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `h-8 rounded-lg border border-slate-200 text-[11px] font-bold flex items-center justify-center transition-all ${t.id === state.selectedTheme ? 'ring-2 ring-purple-600 font-extrabold shadow-sm' : 'hover:opacity-80'}`;
                btn.style.backgroundColor = t.color;
                btn.style.color = t.id === 'dark' ? '#ffffff' : '#334155';
                btn.innerText = t.label;
                btn.onclick = () => {
                    state.selectedTheme = t.id;
                    initThemeButtons();
                    applyTheme();
                };
                container.appendChild(btn);
            });
        }

        // Apply Export Theme Style
        function applyTheme() {
            const canvas = document.getElementById('timeline-canvas');
            THEMES.forEach(t => canvas.classList.remove(t.class));
            const selectedThemeObj = THEMES.find(t => t.id === state.selectedTheme) || THEMES[1];
            canvas.classList.add(selectedThemeObj.class);
        }

        // Initialize Color Palette Selector
        function initColorPalette() {
            const container = document.getElementById('color-palette');
            container.innerHTML = '';

            COLOR_PALETTE.forEach(c => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `color-dot w-7 h-7 rounded-full border-2 border-white shadow-sm transition-transform flex items-center justify-center text-xs ${c.hex === state.selectedColor ? 'selected' : ''}`;
                btn.style.backgroundColor = c.hex;
                btn.title = c.name;
                btn.onclick = () => {
                    state.selectedColor = c.hex;
                    initColorPalette();
                };

                if (c.hex === state.selectedColor) {
                    const check = document.createElement('i');
                    check.className = 'fa-solid fa-check';
                    check.style.color = c.text;
                    btn.appendChild(check);
                }

                container.appendChild(btn);
            });
        }

        // Update Start & End Year Option Lists with Age
        function updateYearOptions(resetToBirthYear = false) {
            const startSelect = document.getElementById('item-start-year');
            const endSelect = document.getElementById('item-end-year');

            const currentStartVal = resetToBirthYear ? state.birthYear : (startSelect.value ? parseInt(startSelect.value) : state.birthYear);
            const currentEndVal = endSelect.value ? parseInt(endSelect.value) : CURRENT_YEAR;

            startSelect.innerHTML = '';
            endSelect.innerHTML = '';

            for (let y = state.birthYear; y <= CURRENT_YEAR; y++) {
                const age = y - state.birthYear;

                const optS = document.createElement('option');
                optS.value = y;
                optS.textContent = `${y}年 (${age}歳)`;
                if (y === currentStartVal) optS.selected = true;
                startSelect.appendChild(optS);

                const optE = document.createElement('option');
                optE.value = y;
                const nowLabel = y === CURRENT_YEAR ? '・現在' : '';
                optE.textContent = `${y}年 (${age}歳${nowLabel})`;
                if (y === currentEndVal) optE.selected = true;
                endSelect.appendChild(optE);
            }
        }

        // Config Changed Event
        function updateConfig() {
            state.title = document.getElementById('timeline-title-input').value || 'わたしのオタク年表';
            const oldBirth = state.birthYear;
            state.birthYear = parseInt(document.getElementById('birth-year-select').value);
            state.scaleMode = document.getElementById('scale-mode-select').value;

            if (oldBirth !== state.birthYear) {
                updateYearOptions(true);
                // Also update default '自分' item if present
                const selfItem = state.items.find(i => i.id === 'default-1');
                if (selfItem) {
                    selfItem.startYear = state.birthYear;
                }
            }
            render();
        }

        // Toggle Ongoing checkbox behavior
        function toggleOngoing(isChecked) {
            const endSelect = document.getElementById('item-end-year');
            if (isChecked) {
                endSelect.value = CURRENT_YEAR;
                endSelect.disabled = true;
                endSelect.classList.add('bg-slate-100', 'opacity-70');
            } else {
                endSelect.disabled = false;
                endSelect.classList.remove('bg-slate-100', 'opacity-70');
            }
        }

        // Add / Edit Entry Handler
        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editing-id').value;
            const title = document.getElementById('item-title').value.trim();
            const memo = document.getElementById('item-memo').value.trim();
            let startYear = parseInt(document.getElementById('item-start-year').value);
            const isOngoing = document.getElementById('item-is-ongoing').checked;
            let endYear = isOngoing ? CURRENT_YEAR : parseInt(document.getElementById('item-end-year').value);

            if (!title) return;

            if (startYear > endYear) {
                const temp = startYear;
                startYear = endYear;
                endYear = temp;
            }

            if (editId) {
                const index = state.items.findIndex(i => i.id === editId);
                if (index !== -1) {
                    state.items[index] = {
                        ...state.items[index],
                        title,
                        memo,
                        startYear,
                        endYear,
                        color: state.selectedColor
                    };
                }
            } else {
                const newItem = {
                    id: 'item-' + Date.now(),
                    title,
                    memo,
                    startYear,
                    endYear,
                    color: state.selectedColor
                };
                state.items.push(newItem);
            }

            resetForm();
            render();
        }

        // Reset Add/Edit Form
        function resetForm() {
            document.getElementById('editing-id').value = '';
            document.getElementById('item-title').value = '';
            document.getElementById('item-memo').value = '';
            document.getElementById('item-is-ongoing').checked = false;
            toggleOngoing(false);
            
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-circle-plus text-purple-500"></i> 新しいコンテンツを追加`;
            document.getElementById('submit-btn').innerHTML = `<i class="fa-solid fa-plus text-xs"></i> <span>年表に追加する</span>`;
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            
            const randomColorIndex = Math.floor(Math.random() * COLOR_PALETTE.length);
            state.selectedColor = COLOR_PALETTE[randomColorIndex].hex;
            initColorPalette();
        }

        // Edit Item Action
        function editItem(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editing-id').value = item.id;
            document.getElementById('item-title').value = item.title;
            document.getElementById('item-memo').value = item.memo || '';
            document.getElementById('item-start-year').value = item.startYear;
            document.getElementById('item-end-year').value = item.endYear;
            
            const isOngoing = item.endYear === CURRENT_YEAR;
            document.getElementById('item-is-ongoing').checked = isOngoing;
            toggleOngoing(isOngoing);

            state.selectedColor = item.color;
            initColorPalette();

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-purple-500"></i> コンテンツを編集`;
            document.getElementById('submit-btn').innerHTML = `<i class="fa-solid fa-check text-xs"></i> <span>変更を保存</span>`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            document.getElementById('item-title').focus();
        }

        // Delete Item Action
        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            if (document.getElementById('editing-id').value === id) {
                resetForm();
            }
            render();
        }

        // Move Item in list order
        function moveItem(id, direction) {
            const index = state.items.findIndex(i => i.id === id);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= state.items.length) return;

            const temp = state.items[index];
            state.items[index] = state.items[newIndex];
            state.items[newIndex] = temp;
            render();
        }

        // Calculate automatic track allocation for items to avoid horizontal overlaps
        function allocateTracks(items) {
            const sorted = [...items].sort((a, b) => {
                if (a.startYear !== b.startYear) return a.startYear - b.startYear;
                return (b.endYear - b.startYear) - (a.endYear - a.startYear);
            });

            const tracks = [];

            return sorted.map(item => {
                let assignedTrack = -1;
                for (let t = 0; t < tracks.length; t++) {
                    if (tracks[t] < item.startYear) {
                        assignedTrack = t;
                        tracks[t] = item.endYear;
                        break;
                    }
                }
                if (assignedTrack === -1) {
                    assignedTrack = tracks.length;
                    tracks.push(item.endYear);
                }
                return { ...item, track: assignedTrack };
            });
        }

        // Render function
        function render() {
            document.getElementById('display-timeline-title').innerText = state.title;
            document.getElementById('display-birth-info').innerText = `${state.birthYear}年生まれ`;
            document.getElementById('display-period-info').innerText = `${state.birthYear} - ${CURRENT_YEAR}年`;

            applyTheme();
            renderItemsList();
            renderCanvasGrid();
        }

        // Render Management Sidebar List
        function renderItemsList() {
            const listEl = document.getElementById('items-list');
            document.getElementById('items-count-badge').innerText = `${state.items.length}件`;
            listEl.innerHTML = '';

            if (state.items.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-6 text-slate-400 text-xs">
                        コンテンツが登録されていません。<br>上のフォームから追加してください。
                    </div>
                `;
                return;
            }

            state.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl border border-slate-200/70 transition-all text-xs';
                
                const paletteObj = COLOR_PALETTE.find(c => c.hex.toLowerCase() === item.color.toLowerCase()) || { name: '' };
                const endText = item.endYear === CURRENT_YEAR ? '現在' : `${item.endYear}`;
                const startAge = item.startYear - state.birthYear;
                const endAge = item.endYear - state.birthYear;

                card.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 pr-2">
                        <span class="w-3.5 h-3.5 rounded-full flex-shrink-0 shadow-sm" style="background-color: ${item.color}" title="${paletteObj.name}"></span>
                        <div class="truncate">
                            <p class="font-bold text-slate-800 truncate">${escapeHtml(item.title)}</p>
                            <p class="text-[10px] text-slate-500">${item.startYear}年(${startAge}歳) - ${endText}${item.endYear === CURRENT_YEAR ? '' : `年(${endAge}歳)`}${item.memo ? ` | ${escapeHtml(item.memo)}` : ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 flex-shrink-0 text-slate-400">
                        <button onclick="moveItem('${item.id}', -1)" ${index === 0 ? 'disabled class="opacity-30 cursor-not-allowed px-1"' : 'class="hover:text-slate-700 px-1"'}>
                            <i class="fa-solid fa-chevron-up text-[10px]"></i>
                        </button>
                        <button onclick="moveItem('${item.id}', 1)" ${index === state.items.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed px-1"' : 'class="hover:text-slate-700 px-1"'}>
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </button>
                        <button onclick="editItem('${item.id}')" class="hover:text-purple-600 px-1">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}')" class="hover:text-rose-600 px-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Render Grid & Timeline Bars inside Canvas
        function renderCanvasGrid() {
            const container = document.getElementById('timeline-grid-container');
            container.innerHTML = '';

            const startY = state.birthYear;
            const endY = CURRENT_YEAR;
            const totalYears = endY - startY + 1;

            const itemsWithTracks = allocateTracks(state.items);
            const totalTracks = itemsWithTracks.reduce((max, item) => Math.max(max, item.track), -1) + 1;
            const trackHeight = 40;
            const headerHeight = 44;

            // Enforce sufficient width so mobile horizontal scroll reaches 2026 smoothly
            const minCellWidth = 54;
            const calculatedWidth = totalYears * minCellWidth;
            container.style.width = `${calculatedWidth}px`;
            container.style.minWidth = `${calculatedWidth}px`;

            const mainGrid = document.createElement('div');
            mainGrid.className = 'grid relative w-full select-none';
            mainGrid.style.gridTemplateColumns = `repeat(${totalYears}, minmax(0, 1fr))`;

            // 1. Header Cells (Single unified 4-digit year or age without sublabel)
            for (let y = startY; y <= endY; y++) {
                const cell = document.createElement('div');
                cell.className = 'px-1 py-1 text-center border-b border-slate-300/50 flex items-center justify-center font-extrabold text-slate-700 bg-white/30 backdrop-blur-sm z-20';
                cell.style.height = `${headerHeight}px`;

                const age = y - startY;
                const label = state.scaleMode === 'year' ? `${y}` : `${age}歳`;

                cell.innerHTML = `<span class="text-xs tracking-tight font-extrabold">${label}</span>`;
                mainGrid.appendChild(cell);
            }

            // 2. Background Grid Lines Area
            const bodyHeight = Math.max(totalTracks * trackHeight + 30, 160);
            const bgContainer = document.createElement('div');
            bgContainer.className = 'absolute top-0 left-0 w-full h-full pointer-events-none grid z-0';
            bgContainer.style.gridTemplateColumns = `repeat(${totalYears}, minmax(0, 1fr))`;
            bgContainer.style.height = `${headerHeight + bodyHeight}px`;

            for (let i = 0; i < totalYears; i++) {
                const line = document.createElement('div');
                line.className = `border-r ${i === totalYears - 1 ? 'border-transparent' : 'border-slate-300/30'}`;
                bgContainer.appendChild(line);
            }
            container.appendChild(bgContainer);
            container.appendChild(mainGrid);

            // 3. Timeline Items Area
            const barsContainer = document.createElement('div');
            barsContainer.className = 'relative w-full z-10 mt-3';
            barsContainer.style.height = `${bodyHeight}px`;

            itemsWithTracks.forEach(item => {
                const bar = document.createElement('div');
                const startIdx = Math.max(0, item.startYear - startY);
                const endIdx = Math.min(totalYears - 1, item.endYear - startY);
                const spanYears = endIdx - startIdx + 1;

                const leftPercent = (startIdx / totalYears) * 100;
                const widthPercent = (spanYears / totalYears) * 100;

                const topPx = item.track * trackHeight;
                const paletteObj = COLOR_PALETTE.find(c => c.hex.toLowerCase() === item.color.toLowerCase()) || { text: '#ffffff' };

                bar.className = 'timeline-bar absolute rounded-full px-3 py-1 flex items-center justify-between text-xs font-bold truncate cursor-pointer';
                bar.style.left = `${leftPercent}%`;
                bar.style.width = `calc(${widthPercent}% - 4px)`;
                bar.style.marginLeft = '2px';
                bar.style.top = `${topPx}px`;
                bar.style.height = '32px';
                bar.style.backgroundColor = item.color;
                bar.style.color = paletteObj.text;

                const isOngoing = item.endYear === CURRENT_YEAR;
                const memoText = item.memo ? ` (${escapeHtml(item.memo)})` : '';
                
                bar.innerHTML = `
                    <span class="truncate font-extrabold flex items-center gap-1">
                        <span>${escapeHtml(item.title)}</span>
                        <span class="font-normal opacity-90 text-[10px]">${memoText}</span>
                    </span>
                    ${isOngoing ? '<span class="text-[10px] flex-shrink-0 bg-white/20 backdrop-blur-sm px-1.5 py-0.5 rounded-full ml-1">🔥 現在</span>' : ''}
                `;

                bar.onclick = () => editItem(item.id);
                barsContainer.appendChild(bar);
            });

            container.appendChild(barsContainer);
        }

        // Helper function for HTML escaping
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Export Timeline as PNG Image
        async function exportImage() {
            const btn = document.getElementById('export-btn');
            const target = document.getElementById('timeline-canvas');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>画像生成中...</span>`;

            try {
                // Temporary force full scroll width expansion for full snapshot
                const scrollWrapper = target.parentElement;
                const originalScrollLeft = scrollWrapper.scrollLeft;

                const canvas = await html2canvas(target, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: null,
                    logging: false,
                    windowWidth: target.scrollWidth + 100
                });

                const link = document.createElement('a');
                link.download = `${state.title.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Export error:', err);
                alert('画像の出力中にエラーが発生しました。');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-download"></i> <span>画像として保存 (.PNG)</span>`;
            }
        }
    </script>
</body>
</html>
